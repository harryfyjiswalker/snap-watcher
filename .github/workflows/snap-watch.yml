name: Eurostar Snap watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub often runs it late; that's normal)
  workflow_dispatch:         # lets you press "Run workflow" manually
    inputs:
      debug:
        description: "Save screenshots/HTML of every page (1 = yes)"
        default: "0"
      dates:
        description: "Optional: check these dates instead of the DATES variable (e.g. 2026-11-20,2026-11-21)"
        default: ""

concurrency:
  group: snap-watcher
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: Check Snap
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          DATES: ${{ github.event.inputs.dates || vars.DATES }}
          DEBUG: ${{ github.event.inputs.debug }}
        run: python snap_watch.py

      - name: Save state
        if: always()
        run: |
          git config user.name "snap-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update Snap state"
          git pull --rebase --quiet && git push --quiet

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
